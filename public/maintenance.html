<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Under Construction — The Plateau Consensus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf8f5;
      --fg: #0d1b0d;
      --accent: #2d5a3d;
      --accent-light: #5a8a5c;
      --muted: #6b7280;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 76px;
      height: 76px;
      margin-bottom: 2rem;
      object-fit: contain;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: clamp(1rem, 2vw, 1.125rem);
      color: var(--muted);
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.6rem 1.2rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #a0c49d;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    footer {
      margin-top: auto;
      padding-top: 2rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <img src="/brand-logo.png" alt="The Plateau Consensus" class="logo" />
    <div class="badge">Under Construction</div>
    <h1>We’re Building Something Great</h1>
    <p>The Plateau Consensus platform is currently undergoing updates. We’ll be back online shortly. Thank you for your patience.</p>
    <footer>
      &copy; <span id="year"></span> The Plateau Consensus. All rights reserved.
    </footer>
  </div>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
